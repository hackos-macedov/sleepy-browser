
name: Build Sleepy Browser

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build browser
        run: cargo build --release

      - name: Save EXE
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-browser
          path: target/release/sleepy-browser.exe

